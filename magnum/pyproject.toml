[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magnum"
version = "0.2.0"
description = "Моделирование бизнеса как случайного потока событий на Python"
requires-python = ">=3.9"
dependencies = ["torch>=1.13"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["magnum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
